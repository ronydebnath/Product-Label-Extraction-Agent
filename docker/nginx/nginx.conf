# Runs as the unprivileged `app` user: unprivileged port, pid and temp paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 20 files x 10 MB plus multipart overhead. This is the coarse guard; the app enforces the
    # real per-file and per-request limits and produces the user-facing errors.
    client_max_body_size 210m;

    server {
        listen 8080;
        server_name _;

        # Only public/ is ever served. Uploads live in storage/app/private and are streamed
        # by PHP after an authorization check, never by nginx.
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Vite-hashed bundles are immutable by construction.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
