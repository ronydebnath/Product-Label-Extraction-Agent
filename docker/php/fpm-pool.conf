[www]
; The php-fpm master itself runs as the unprivileged `app` user (Dockerfile USER),
; so there is no root-to-www-data switch here. Loopback only: nginx is in the same container.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; nginx already writes an access log; a second one from fpm just doubles the noise.
access.log = /dev/null
