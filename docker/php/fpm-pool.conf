; Replaces the image's stock www.conf. The php-fpm master itself runs as the unprivileged `app`
; user (Dockerfile USER), so there is no user/group directive here: php-fpm would only ignore it
; with a notice on every boot. The image's docker.conf (loaded first) keeps logs on stderr and
; clear_env=no so the container environment reaches PHP.
[www]
; Loopback only: nginx is in the same container.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; nginx already writes an access log; a second one from fpm just doubles the noise.
access.log = /dev/null
