; Applies to php-fpm (web) and the CLI (Horizon workers, artisan) alike.
memory_limit = 256M
date.timezone = UTC
expose_php = Off

; Upload caps in PHP terms. The app applies the precise rules (config/uploads.php) and produces
; the user-facing messages; these values only stop oversized requests from reaching it at all.
upload_max_filesize = 10M
post_max_size = 210M
max_file_uploads = 20

; Opcache: code inside the image is immutable, so never stat files (validate_timestamps=0).
; docker/php/opcache-dev.ini re-enables validation for the bind-mounted dev target.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
