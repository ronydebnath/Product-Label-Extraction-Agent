# Development overrides. `docker compose up` merges this automatically.
# Everything here is convenience: bind mounts for hot reload, the Vite dev server, exposed DB ports.
#
# The dev image is tagged separately from the production one. Both are built from the same
# Dockerfile at different targets, and sharing one tag means `docker compose -f compose.yaml build`
# silently replaces the dev image with the production stage -- which then runs the whole stack with
# opcache timestamp validation off, serving stale bytecode for every file you edit.

services:
  web:
    build: { target: dev }
    image: label-extraction/app:dev
    volumes:
      - .:/var/www/html

  worker:
    build: { target: dev }
    image: label-extraction/app:dev
    volumes:
      - .:/var/www/html

  scheduler:
    build: { target: dev }
    image: label-extraction/app:dev
    volumes:
      - .:/var/www/html

  migrate:
    build: { target: dev }
    image: label-extraction/app:dev
    volumes:
      - .:/var/www/html

  # Vite dev server with HMR. Only exists in dev; production serves the bundle baked into the image.
  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    volumes:
      - .:/var/www/html
      # Native binaries (tailwind oxide, rolldown) are platform-specific; keep them off the host.
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"

  # Database console, dev only and deliberately absent from compose.yaml: it is an unauthenticated
  # gateway to Postgres for anyone who can reach the port, which is fine on a laptop and a serious
  # hole anywhere else. It talks to the postgres service over the compose network, so nothing has
  # to be published from the database itself for it to work.
  adminer:
    image: adminer:5
    environment:
      # Pre-fills the login form; the password is still the one from .env.
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DRIVER: pgsql
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Creates the test database on first init so tests run against real Postgres, not sqlite.
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

volumes:
  node_modules:
